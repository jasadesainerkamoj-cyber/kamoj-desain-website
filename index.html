<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jasa Ojol Kamora</title>
<style>body{font-family:Arial;background:#f1f5f9;padding:20px}.box{background:white;padding:20px;border-radius:12px;max-width:400px;margin:auto;box-shadow:0 4px 10px rgba(0,0,0,0.1)}h2{text-align:center;color:#16a34a}input,select,textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:8px}button{width:100%;padding:12px;background:#25D366;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold}</style>
</head>
<body><div class="box"><h2>🛵 Jasa Ojol Kamora</h2>
<form id="ojolForm">
<label>Layanan</label><select id="layanan"><option>Ojek Penumpang</option><option>Antar Barang</option></select>
<label>Nama</label><input type="text" id="nama" required>
<label>No WA</label><input type="tel" id="hp" required>
<label>Jemput</label><textarea id="jemput" required></textarea>
<label>Tujuan</label><textarea id="tujuan" required></textarea>
<button type="submit">📲 PESAN SEKARANG</button>
</form></div>
<script>document.getElementById('ojolForm').addEventListener('submit',function(e){e.preventDefault();let p=`*ORDER BARU OJEK KAMORA*%0A%0A*Layanan*: ${layanan.value}%0A*Nama*: ${nama.value}%0A*No WA*: ${hp.value}%0A*Jemput*: ${jemput.value}%0A*Tujuan*: ${tujuan.value}`;window.open(`https://wa.me/6282183001690?text=${p}`,'_blank');this.reset()})</script>
</body></html>
