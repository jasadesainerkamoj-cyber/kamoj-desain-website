<!DOCTYPE html> 
<html lang="id"> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>KamOj - Ojol Kamora</title> 
<style> 
body{font-family:Arial;background:#f0f0f0;padding:20px} 
.box{background:white;padding:20px;border-radius:12px;max-width:400px;margin:auto} 
h2{text-align:center;color:#16a34a} 
button{width:100%;padding:15px;background:#25D366;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold;margin-top:10px;cursor:pointer} 
.btn-driver{background:#1677FF;} 
</style> 
</head> 
<body> 

<div class="box">
  <h2>🛵 KamOj - Ojol Kamora</h2>
  <p style="text-align:center;">Sistem Ojek Online Pertama di Kamora</p>
  
  <button onclick="pesanOjek()">PESAN OJEK / ANTAR</button>
  <button class="btn-driver" onclick="daftarDriver()">DAFTAR JADI DRIVER</button>
</div>

<script> 
function pesanOjek(){
  let pesan = "HALO ADMIN KAMOJ%0A%0A*SAYA MAU PESAN OJEK*";
  window.open("https://wa.me/628134595671?text=" + pesan, "_blank"); 
}

function daftarDriver(){
  let pesan = "HALO ADMIN KAMOJ%0A%0A*SAYA MAU DAFTAR JADI DRIVER*";
  window.open("https://wa.me/628134595671?text=" + pesan, "_blank"); 
}
</script> 
</body> 
</html>
