
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Agency - Portfolio</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
        body { background:#0f0f1a; color:#fff; padding:20px; }
        .container { max-width:1200px; margin:auto; background:#1a1a2e; padding:30px; border-radius:24px; }
        .header { text-align:center; padding:20px 0; border-bottom:2px solid #2a2a4a; }
        .header h1 { font-size:2.8rem; background:linear-gradient(135deg,#f093fb,#f5576c); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .section-title { font-size:1.8rem; margin:40px 0 20px; color:#f093fb; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .card {
            background: #252545;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid #33335a;
            transition: 0.3s;
        }
        .card:hover { transform:translateY(-8px); border-color:#f5576c; box-shadow:0 12px 30px rgba(245,87,108,0.3); }
        .card img { width:100%; border-radius:12px; height:200px; object-fit:cover; background:#1a1a2e; }
        .card h4 { margin:12px 0 5px; color:#fff; }
        .card p { color:#999; font-size:0.9rem; }
        .card .category { color:#f5576c; font-size:0.8rem; font-weight:bold; }
        
        .loading { text-align:center; padding:40px; color:#999; }
        .error { text-align:center; padding:40px; color:#f5576c; }
        .btn-refresh { 
            background:#f5576c; color:#fff; border:none; padding:10px 25px; 
            border-radius:30px; cursor:pointer; margin:10px auto; display:inline-block;
        }
        .btn-refresh:hover { background:#d94a5e; }
        
        .footer { text-align:center; margin-top:40px; color:#666; border-top:1px solid #2a2a4a; padding-top:25px; }
        
        @media (max-width:600px) {
            .header h1 { font-size:1.8rem; }
            .container { padding:15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎨 Design Agency</h1>
        <p>Portfolio Tim Desain Profesional</p>
    </div>

    <div class="section-title">📂 Portfolio</div>
    <div id="loading" class="loading">⏳ Memuat portfolio...</div>
    <div class="grid" id="portfolio-list"></div>
    <div style="text-align:center;">
        <button class="btn-refresh" onclick="loadPortfolio()">🔄 Refresh Data</button>
    </div>

    <div class="footer">&copy; 2026 Design Agency - Portfolio otomatis dari Google Sheets 🚀</div>
</div>

<script>
    // ========================================
    // 📝 GANTI LINK INI DENGAN LINK GOOGLE SHEETS ANDA
    // ========================================
    const SHEETS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vXXXXX/pub?output=csv';
    // Ganti dengan link Anda!

    async function loadPortfolio() {
        const container = document.getElementById('portfolio-list');
        const loading = document.getElementById('loading');

        try {
            loading.style.display = 'block';
            loading.innerHTML = '⏳ Memuat data...';
            loading.className = 'loading';

            const response = await fetch(SHEETS_URL);
            const csvText = await response.text();
            
            // Parse CSV
            const rows = csvText.split('\n').map(row => row.split(','));
            
            // Hapus header (baris pertama)
            const data = rows.slice(1).filter(row => row[2] && row[2].trim() !== '');
            
            if (data.length === 0) {
                loading.innerHTML = '⚠️ Belum ada data. Tambahkan di Google Sheets!';
                loading.className = 'error';
                container.innerHTML = '';
                return;
            }

            loading.style.display = 'none';

            // Render data
            container.innerHTML = data.map(row => {
                const nama = row[0]?.trim() || 'Tanpa Judul';
                const kategori = row[1]?.trim() || 'Umum';
                const gambar = row[2]?.trim() || '';
                const deskripsi = row[3]?.trim() || '';

                return `
                    <div class="card">
                        <img src="${gambar}" alt="${nama}" onerror="this.src='https://via.placeholder.com/300x200?text=Gambar+Error'" />
                        <h4>${nama}</h4>
                        <div class="category">${kategori}</div>
                        <p>${deskripsi}</p>
                    </div>
                `;
            }).join('');

        } catch (error) {
            loading.innerHTML = '❌ Gagal memuat data. Cek link Google Sheets!';
            loading.className = 'error';
            console.error('Error:', error);
        }
    }

    // Jalankan saat halaman dimuat
    loadPortfolio();
</script>

</body>
</html>
