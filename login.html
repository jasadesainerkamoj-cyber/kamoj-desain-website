<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk - KamOj</title>
<meta name="theme-color" content="#050505">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
<style>
:root{--bg:#050505;--panel:#141416;--line:#2a2a2e;--red:#d4141f;--red-hot:#ff2b3a;--text:#f2f2f2;--muted:#a0a0a8;
  --display:Impact,Haettenschweiler,"Arial Narrow Bold","Roboto Condensed",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 var(--body);min-height:100vh;display:grid;place-items:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(20px + env(safe-area-inset-bottom,0px))}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--red);border-radius:6px;padding:26px 22px}
h1{font:italic 400 44px/1 var(--display);text-shadow:2px 2px 0 #000}
h1 b{color:var(--red-hot);font-weight:400}
p.sub{color:var(--muted);margin:8px 0 20px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
input{width:100%;background:#0b0b0d;color:var(--text);border:2px solid var(--line);border-radius:8px;padding:13px 14px;font:inherit;font-size:17px}
input:focus{border-color:var(--red);outline:none}
#code{letter-spacing:.35em;text-align:center;font-size:24px}
.cf{margin:16px 0;min-height:65px}
button{width:100%;background:var(--red);color:#fff;border:0;border-radius:8px;padding:14px;font:700 16px var(--body);cursor:pointer;margin-top:6px}
button:hover{background:var(--red-hot)}
button:disabled{opacity:.55;cursor:wait}
button.ghost{background:transparent;border:2px solid var(--line);color:var(--muted);margin-top:10px}
#msg{margin-top:14px;min-height:22px;font-size:14px}
#msg.err{color:var(--red-hot)} #msg.ok{color:#5ad17a}
.hide{display:none}
a{color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <h1>Kam<b>Oj</b></h1>

  <!-- Langkah 1: email -->
  <section id="step1">
    <p class="sub">Masuk dengan email. Kami kirim kode 6 angka, tanpa kata sandi.</p>
    <label for="email">Email</label>
    <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="nama@email.com">
    <div class="cf" id="turnstile"></div>
    <button id="send" type="button">Kirim kode</button>
  </section>

  <!-- Langkah 2: kode -->
  <section id="step2" class="hide">
    <p class="sub" id="sent"></p>
    <label for="code">Kode 6 angka</label>
    <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="------">
    <button id="verify" type="button">Masuk</button>
    <button id="back" class="ghost" type="button">Ganti email</button>
  </section>

  <!-- Setelah masuk -->
  <section id="done" class="hide">
    <p class="sub" id="who"></p>
    <button id="logout" type="button">Keluar</button>
  </section>

  <p id="msg" role="status" aria-live="polite"></p>
  <p style="margin-top:18px;font-size:14px"><a href="index.html">Kembali ke beranda</a></p>
</main>

<script>
/* ISI TIGA NILAI INI. Hanya kunci publik yang boleh ada di sini. */
const SUPABASE_URL = "ISI_URL_PROYEK_SUPABASE";      // contoh: https://xxxx.supabase.co
const SUPABASE_PUBLISHABLE_KEY = "ISI_KUNCI_PUBLIK";  // publishable / anon key, BUKAN secret / service_role
const TURNSTILE_SITE_KEY = "0x4AAAAAAFS4ko3mm6LvwFKj";

const $ = id => document.getElementById(id);
let captchaToken = "", widgetId = null, emailNow = "";

function say(text, kind){ const m = $("msg"); m.textContent = text || ""; m.className = kind || ""; }
function show(step){ ["step1","step2","done"].forEach(s => $(s).classList.toggle("hide", s !== step)); }
function busy(btn, on){ btn.disabled = on; }

async function api(path, body){
  const r = await fetch(SUPABASE_URL + "/auth/v1/" + path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SUPABASE_PUBLISHABLE_KEY },
    body: JSON.stringify(body)
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.msg || data.error_description || data.message || "Terjadi kesalahan (" + r.status + ")");
  return data;
}

function resetCaptcha(){ captchaToken = ""; if (window.turnstile && widgetId !== null) window.turnstile.reset(widgetId); }

function initTurnstile(){
  if (!window.turnstile) { setTimeout(initTurnstile, 200); return; }
  widgetId = window.turnstile.render("#turnstile", {
    sitekey: TURNSTILE_SITE_KEY, theme: "dark",
    callback: t => { captchaToken = t; },
    "expired-callback": () => { captchaToken = ""; },
    "error-callback": () => { captchaToken = ""; say("Pemeriksaan keamanan gagal dimuat. Muat ulang halaman.", "err"); }
  });
}

$("send").addEventListener("click", async () => {
  const email = $("email").value.trim();
  if (!/^\S+@\S+\.\S+$/.test(email)) return say("Masukkan email yang valid.", "err");
  if (SUPABASE_URL.startsWith("ISI_")) return say("Nilai Supabase belum diisi di login.html.", "err");
  if (!captchaToken) return say("Selesaikan pemeriksaan keamanan dulu.", "err");
  busy($("send"), true); say("Mengirim kode...");
  try {
    await api("otp", { email, create_user: true, gotrue_meta_security: { captcha_token: captchaToken } });
    emailNow = email;
    $("sent").textContent = "Kode dikirim ke " + email + ". Cek kotak masuk dan folder spam.";
    show("step2"); say(""); $("code").focus();
  } catch (e) { say(e.message, "err"); }
  resetCaptcha(); busy($("send"), false);
});

$("verify").addEventListener("click", async () => {
  const token = $("code").value.trim();
  if (token.length < 6) return say("Masukkan kode 6 angka dari email.", "err");
  busy($("verify"), true); say("Memeriksa kode...");
  try {
    const d = await api("verify", { type: "email", email: emailNow, token });
    try { localStorage.setItem("kamoj-session", JSON.stringify({ access_token: d.access_token, refresh_token: d.refresh_token, email: emailNow })); } catch (e) {}
    $("who").textContent = "Berhasil masuk sebagai " + emailNow + ".";
    show("done"); say("Selamat datang!", "ok");
  } catch (e) { say(e.message, "err"); }
  busy($("verify"), false);
});

$("back").addEventListener("click", () => { show("step1"); say(""); $("code").value = ""; });

$("logout").addEventListener("click", () => {
  try { localStorage.removeItem("kamoj-session"); } catch (e) {}
  show("step1"); say("Kamu sudah keluar.", "ok");
});

try {
  const s = JSON.parse(localStorage.getItem("kamoj-session") || "null");
  if (s && s.email) { $("who").textContent = "Kamu sudah masuk sebagai " + s.email + "."; show("done"); }
} catch (e) {}
initTurnstile();
</script>
</body>
</html>
